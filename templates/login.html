<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotXCore · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090e;
  --surface:#0f1019;
  --border:rgba(255,255,255,.05);
  --border2:rgba(255,255,255,.08);
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --text:#f1f5f9;
  --muted:#64748b;
  --danger:#ef4444;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  width:700px;height:700px;
  background:radial-gradient(circle,rgba(99,102,241,.06),transparent 70%);
  top:-200px;right:-100px;
  pointer-events:none;
}
body::after{
  content:'';
  position:fixed;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(139,92,246,.04),transparent 70%);
  bottom:-150px;left:-100px;
  pointer-events:none;
}
.wrap{
  position:relative;z-index:1;
  width:400px;
  padding:44px 36px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 0 60px rgba(99,102,241,.03),0 30px 60px rgba(0,0,0,.5);
  animation:fadeUp .5s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.logo{
  display:flex;align-items:center;gap:10px;
  margin-bottom:36px;
}
.logo-mark{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;
}
.logo-text{
  font-size:18px;font-weight:800;
  letter-spacing:-.3px;
}
h2{font-size:22px;font-weight:800;margin-bottom:4px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px;margin-bottom:28px}
.field{margin-bottom:18px}
label{
  display:block;
  font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin-bottom:6px;
}
input{
  width:100%;
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-radius:8px;
  padding:11px 14px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.08)}
input::placeholder{color:#3a4060}
.btn{
  width:100%;padding:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:14px;font-weight:600;
  border:none;border-radius:8px;
  cursor:pointer;
  transition:opacity .2s,transform .1s;
  margin-top:6px;
}
.btn:hover{opacity:.92;transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error-msg{
  display:none;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  color:var(--danger);
  margin-bottom:16px;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <div class="logo-mark">B</div>
    <div class="logo-text">BotXCore</div>
  </div>

  <h2>Admin Access</h2>
  <p class="sub">Enter your credentials to continue</p>

  <div class="error-msg" id="err"></div>

  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="off">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>

  <button class="btn" id="loginBtn" onclick="login()">Sign In →</button>
</div>

<script>
async function login(){
  const btn=document.getElementById('loginBtn')
  const err=document.getElementById('err')
  const u=document.getElementById('username').value.trim()
  const p=document.getElementById('password').value
  err.style.display='none'
  btn.disabled=true
  btn.textContent='Signing in...'
  try{
    const r=await fetch('/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p})
    })
    const data=await r.json()
    if(r.ok){window.location.href='/admin/'}
    else{err.textContent='Invalid credentials';err.style.display='block'}
  }catch(e){
    err.textContent='Connection failed';err.style.display='block'
  }
  btn.disabled=false
  btn.textContent='Sign In →'
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()})
</script>
</body>
</html>
